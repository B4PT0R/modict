[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "modict"
version = "0.4.12"
description = "A dict subclass with optional typed fields, validators, computed values, and deep nested ops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "baptiste", email = "bferrand.maths@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonpath-ng>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-html>=4.1.1",
    "flake8",
    "black",
    "typing_extensions>=4.0",
]

[project.urls]
Homepage = "https://github.com/B4PT0R/modict"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "modict*",
]

[tool.pytest.ini_options]
addopts = "-p no:asyncio -p no:rerunfailures"
